# Dev overrides — loaded automatically by `docker compose up`
#
# Maps ports to localhost so you can reach each service from your browser
# and dev tools. Also exposes MySQL for direct DB client access.

services:
  echo-database:
    ports:
      - "127.0.0.1:13306:3306"

  echo-service:
    ports:
      - "127.0.0.1:18080:8080"

  echo-web:
    ports:
      - "127.0.0.1:3160:3160"

  echo-media:
    ports:
      - "127.0.0.1:18082:8082"
