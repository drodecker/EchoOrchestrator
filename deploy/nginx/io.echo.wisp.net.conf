server {
    listen 80;
    listen [::]:80;
    server_name io.echo.wisp.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name io.echo.wisp.net;

    ssl_certificate     /opt/nginx-proxy-manager/letsencrypt/live/npm-11/fullchain.pem;
    ssl_certificate_key /opt/nginx-proxy-manager/letsencrypt/live/npm-11/privkey.pem;

    # Inbound Tychron MMS carries its media inline as base64 in the webhook
    # body, where Bandwidth sends a URL to fetch later. base64 adds about a
    # third, and Tychron's per-file ceiling is 2 MB, so nginx's 1 MB default
    # would 413 an ordinary photo — and because Tychron treats any non-2xx as
    # a temporary failure, it would redeliver that message indefinitely.
    #
    # Matches EchoService's own express.json limit, so the application is what
    # enforces the ceiling with a real error rather than the proxy with a bare
    # 413.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
