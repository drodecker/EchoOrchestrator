# Historical fallback only.
#
# Production `media.echo.wisp.net` should be managed by Nginx Proxy Manager/openresty
# on proxy.wisp.net, proxying to the EchoMedia container over Docker DNS:
#   media.echo.wisp.net -> NPM proxy host id 8 -> http://echo-media:8082
#
# Keep this file only as a manual host-nginx fallback reference if NPM is intentionally bypassed.

server {
    listen 80;
    listen [::]:80;
    server_name media.echo.wisp.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.echo.wisp.net;

    ssl_certificate     /opt/nginx-proxy-manager/letsencrypt/live/npm-12/fullchain.pem;
    ssl_certificate_key /opt/nginx-proxy-manager/letsencrypt/live/npm-12/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
