# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/   ../id/

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      CORS_ORIGINS: "*"
      MEDIA_ROOT: /media
    depends_on:
      echo-database:
        condition: service_healthy
    volumes:
      - echo_media_data:/media
    restart: unless-stopped
    networks:
      - echo-net

  # ── Settings store (NocoDB) ────────────────────────────────────────────────
  # Home of the shared oAuthConfig table (base `id`). Admins reach the UI at
  # nocodb.<parent-domain>; id-web and echo-web read/write it via API token.
  nocodb:
    image: nocodb/nocodb:latest
    container_name: nocodb
    hostname: nocodb
    environment:
      TZ: America/Los_Angeles
      NC_DB: "mysql2://echo-database:3306?u=${MYSQL_USER:-echo_app}&p=${MYSQL_PASSWORD}&d=nocodb_db"
      NC_PUBLIC_URL: ${NOCODB_PUBLIC_URL:-}
    depends_on:
      echo-database:
        condition: service_healthy
    volumes:
      - nocodb_data:/usr/app/data
    restart: unless-stopped
    networks:
      - echo-net

  # ── Identity processor ─────────────────────────────────────────────────────
  # OAuth for every app under the parent domain lives here (id.<parent-domain>).
  # Bootstrap: bring the stack up, create the NocoDB admin + API token, put the
  # token in .env, restart id-web, then claim the instance at /setup.
  id-web:
    build: ../id
    container_name: id-web
    hostname: id-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3200"
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: id_db
      NOCODB_BASE_URL: http://nocodb:8080
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
    depends_on:
      echo-database:
        condition: service_healthy
      nocodb:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      ECHO_SERVICE_BASE_URL: http://echo-service:8080
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:18082}
      # Database (org/membership/session tables live in the same DB)
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # OAuth is delegated to id-web; the shared settings (id base URL,
      # exchange secret, UISP CRM access) come from the NocoDB oAuthConfig
      # table, so no provider credentials appear here any more.
      NOCODB_BASE_URL: http://nocodb:8080
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
      # This app's own public URL (redirect_uri handed to id)
      APP_BASE_URL: ${APP_BASE_URL:-https://dev-echo.localsplash.ai}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-service:
        condition: service_started
      id-web:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:
  nocodb_data:

networks:
  echo-net:
