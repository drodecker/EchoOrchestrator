# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      CORS_ORIGINS: "*"
      MEDIA_ROOT: /media
    depends_on:
      echo-database:
        condition: service_healthy
    volumes:
      - echo_media_data:/media
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      ECHO_SERVICE_BASE_URL: http://echo-service:8080
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:18082}
      # Database (auth tables live in the same DB)
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Microsoft / Entra ID
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      # UISP
      UISP_BASE_URL: ${UISP_BASE_URL:-https://my.wisp.net}
      UISP_CRM_APP_KEY_READ: ${UISP_CRM_APP_KEY_READ}
      UISP_SSO_SECRET: ${UISP_SSO_SECRET}
      UISP_PLUGIN_URL: ${UISP_PLUGIN_URL:-}
      # Public URL (for OAuth redirect URIs)
      APP_BASE_URL: ${APP_BASE_URL:-https://dev-echo.localsplash.ai}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:

networks:
  echo-net:
