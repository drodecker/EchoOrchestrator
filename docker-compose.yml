# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Configuration model:
#   Each service reads its settings from echo_tbl_Settings in the Echo
#   database (EchoDatabase init/009_settings.sql) — rows keyed by sApp, '*'
#   for every app and 'web'/'service'/'media' for one. This file states only
#   what cannot describe itself: how to reach that database, and how to reach
#   the IdentityBase NocoDB base that carries the platform-wide trustedCIDR.
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Schema migrations ──────────────────────────────────────────────────────
  #
  # EchoDatabase's init/ is mounted into the database container at
  # /docker-entrypoint-initdb.d, which MySQL runs ONLY when it initialises an
  # empty data directory. Every numbered file added after the first `up` is
  # silently skipped — which is how 009_settings.sql sat in the repo while a
  # running database had no echo_tbl_Settings, and the apps failed at runtime
  # with something that looked nothing like the cause.
  #
  # So the files are applied here too, in order, against the database as it
  # actually is. Each is recorded in echo_tbl_SchemaMigration after it
  # succeeds, so this is a no-op on every start but the first that sees a new
  # file. The apps wait on it completing.
  echo-migrate:
    image: mysql:8.4
    container_name: echo-migrate
    depends_on:
      echo-database:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
    volumes:
      - ../EchoDatabase/init:/init:ro
      - ./scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    restart: "no"
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      # Where echo_tbl_Settings lives. Everything else about this service —
      # the Bandwidth credentials, CORS origins, the webhook basic-auth pair —
      # is a row in it, keyed sApp='service'.
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # And where trustedCIDR lives — the one setting read from outside the
      # Echo database, because a network policy only works if identity and
      # every application agree on it.
      #
      # Both blank on purpose. The identity-config volume below carries
      # identity's /data/config.json, which holds exactly these two keys, and
      # EchoService reads it when the environment is silent. Stating them here
      # would win over the file and put the same secret in a second place.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:-}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
      # ...unless the deployment pins the network, in which case NocoDB is not
      # consulted for it at all.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-migrate:
        condition: service_completed_successfully
    volumes:
      - echo_media_data:/media
      # identity's bootstrap file, read-only: this service reads it and must
      # never write it. Works because both images run as uid 100 and the file
      # is mode 0600 — pinned deliberately in both Dockerfiles, not by luck.
      - identity-config:/data:ro
      # The rotating logs behind EchoService's /logs page. Its own volume
      # precisely because /data above is read-only: the log viewer's first
      # attempt was to write there and it could not. Without this the files
      # still work, but in the container's writable layer, so `up --build`
      # would silently discard the history the page exists to show.
      - echo_service_logs:/var/log/echo
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      # Where echo_tbl_Settings lives. The OAuth and UISP credentials,
      # APP_BASE_URL, ECHO_SERVICE_BASE_URL and MEDIA_BASE_URL are rows in
      # it, keyed sApp='web' (or '*' where every app reads them).
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # And where PARENT_DOMAIN and IDENTITY_CLIENT_SECRET live. Every public
      # URL this app has is derived from the first, and the second is how it
      # authenticates to identity's token endpoint. Blank here on purpose: the
      # identity-config volume below carries them.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL:-}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN:-}
    volumes:
      # identity's bootstrap file, read-only — same file echo-service reads.
      - identity-config:/data:ro
    depends_on:
      echo-database:
        condition: service_healthy
      echo-migrate:
        condition: service_completed_successfully
      echo-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:
  echo_service_logs:
  # Owned by the identity stack, not this one. `external` means this stack
  # fails loudly if identity has not been brought up yet — which is the right
  # order, and a far better failure than inventing a configuration.
  identity-config:
    external: true
    name: ${IDENTITY_CONFIG_VOLUME:-identity_identity-config}

networks:
  echo-net:
