# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Configuration model:
#   Every service reads its settings from the NocoDB base IdentityBase
#   (table auth_tbl_Settings) — see localsplash/identity#15. This file states
#   only how to reach that base, plus what the database container needs to
#   configure itself, which cannot come from a table it is hosting.
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/
#   ../identity/  (the identity service, served at identity.X.TLD)

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      # The two things a service states; everything else — the database
      # coordinates, the Bandwidth credentials, CORS origins, trustedCIDR —
      # is a row in IdentityBase.auth_tbl_Settings.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
    depends_on:
      echo-database:
        condition: service_healthy
    volumes:
      - echo_media_data:/media
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      # The two things a service states. The OAuth and UISP credentials, the
      # database coordinates, ECHO_SERVICE_BASE_URL, MEDIA_BASE_URL,
      # APP_BASE_URL and trustedCIDR are rows in
      # IdentityBase.auth_tbl_Settings, shared with every other application.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Identity (identity.X.TLD) ──────────────────────────────────────────────
  #
  # The single sign-in surface for every app under the parent domain, and the
  # owner of the IdentityBase settings base every other service reads. It
  # creates and seeds that base on first boot; the others only read it.
  identity:
    build: ../identity
    container_name: identity
    hostname: identity
    environment:
      PORT: "3200"
      NOCODB_BASE_URL: ${NOCODB_BASE_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
    ports:
      - "127.0.0.1:3200:3200"
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:

networks:
  echo-net:
