# EchoOrchestrator — Echo Messaging Service stack
#
# Dev:  docker compose up -d             (auto-loads docker-compose.override.yml)
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Production edge model:
#   - Nginx Proxy Manager/openresty on proxy.wisp.net is the canonical TLS/front-door layer
#   - Echo services join shared echo-net so NPM can reverse proxy by container DNS name
#   - localhost-only published ports remain useful for direct service checks/fallback
#
# Configuration model:
#   Each service reads its settings from echo_tbl_Settings in the Echo
#   database (EchoDatabase init/009_settings.sql) — rows keyed by sApp, '*'
#   for every app and 'web'/'service'/'media' for one. This file states only
#   what cannot describe itself: how to reach that database, and how to reach
#   the IdentityBase NocoDB base that carries the platform-wide trustedCIDR.
#
# Expects sibling repo layout:
#   ../EchoDatabase/   ../EchoService/   ../EchoWeb/   ../EchoMedia/

services:

  # ── Database ───────────────────────────────────────────────────────────────
  echo-database:
    image: mysql:8.4
    container_name: echo-database
    hostname: echo-database
    environment:
      TZ: America/Los_Angeles
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-echo_db}
      MYSQL_USER: ${MYSQL_USER:-echo_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - echo_database_data:/var/lib/mysql
      - ../EchoDatabase/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - echo-net

  # ── Mid-tier API ───────────────────────────────────────────────────────────
  echo-service:
    build: ../EchoService
    container_name: echo-service
    hostname: echo-service
    environment:
      PORT: "8080"
      # Where echo_tbl_Settings lives. Everything else about this service —
      # the Bandwidth credentials, CORS origins, the webhook basic-auth pair —
      # is a row in it, keyed sApp='service'.
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # And where trustedCIDR lives — the one setting read from outside the
      # Echo database, because a network policy only works if identity and
      # every application agree on it.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      # ...unless the deployment pins it, in which case NocoDB is not consulted
      # for it at all. Both apps check this before reaching for IdentityBase.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
    depends_on:
      echo-database:
        condition: service_healthy
    volumes:
      - echo_media_data:/media
    restart: unless-stopped
    networks:
      - echo-net

  # ── Web frontend ───────────────────────────────────────────────────────────
  echo-web:
    build: ../EchoWeb
    container_name: echo-web
    hostname: echo-web
    environment:
      TZ: America/Los_Angeles
      PORT: "3160"
      # Where echo_tbl_Settings lives. The OAuth and UISP credentials,
      # APP_BASE_URL, ECHO_SERVICE_BASE_URL and MEDIA_BASE_URL are rows in
      # it, keyed sApp='web' (or '*' where every app reads them).
      DB_HOST: echo-database
      DB_USER: ${MYSQL_USER:-echo_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-echo_db}
      # And where trustedCIDR lives.
      NOCODB_BASE_URL: ${NOCODB_BASE_URL}
      NOCODB_API_TOKEN: ${NOCODB_API_TOKEN}
      # ...unless the deployment pins it; see echo-service above.
      IDENTITY_TRUSTED_NETWORK: ${IDENTITY_TRUSTED_NETWORK:-}
    depends_on:
      echo-database:
        condition: service_healthy
      echo-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - echo-net

  # ── Media delivery ─────────────────────────────────────────────────────────
  echo-media:
    build: ../EchoMedia
    container_name: echo-media
    hostname: echo-media
    environment:
      PORT: "8082"
      MEDIA_ROOT: /media
    volumes:
      - echo_media_data:/media:ro
    restart: unless-stopped
    networks:
      - echo-net

volumes:
  echo_database_data:
  echo_media_data:

networks:
  echo-net:
